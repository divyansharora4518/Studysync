<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI Chat — StudySync</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
body { overflow:hidden; background:#F7F5FF; }
.ai-page { display:flex; flex-direction:column; height:100vh; }
.ai-topbar { height:64px; background:white; border-bottom:1.5px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; flex-shrink:0; }
.ai-topbar-left { display:flex; align-items:center; gap:14px; }
.ai-topbar-icon { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--violet),var(--sky)); display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
.ai-topbar-title { font-family:'Sora',sans-serif; font-weight:700; font-size:1rem; }
.ai-topbar-sub   { font-size:0.74rem; color:var(--gray); margin-top:1px; }
.ai-chat-area { flex:1; overflow-y:auto; padding:20px 5vw; display:flex; flex-direction:column; gap:16px; }
.ai-input-area { background:white; border-top:1.5px solid var(--border); padding:14px 5vw; flex-shrink:0; }
.ai-input-row { display:flex; gap:10px; align-items:flex-end; }
.ai-textarea { flex:1; padding:12px 18px; border:2px solid var(--gray-light); border-radius:16px; font-family:'Nunito',sans-serif; font-size:0.95rem; outline:none; resize:none; max-height:120px; transition:border-color 0.2s; }
.ai-textarea:focus { border-color:var(--violet); }
.ai-send-btn { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--violet-light)); border:none; cursor:pointer; font-size:1.2rem; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(108,78,255,0.35); flex-shrink:0; transition:transform 0.18s; }
.ai-send-btn:hover { transform:scale(1.08); }
.quick-topics { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.qt-chip { padding:6px 14px; border-radius:50px; border:1.5px solid var(--border); background:white; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all 0.18s; }
.qt-chip:hover { border-color:var(--violet); color:var(--violet); background:rgba(108,78,255,0.05); }
.welcome-area { text-align:center; padding:40px 20px; color:var(--gray); }
.welcome-icon { font-size:3rem; margin-bottom:16px; display:block; }
.welcome-title { font-family:'Sora',sans-serif; font-weight:700; font-size:1.3rem; color:var(--dark); margin-bottom:8px; }
.welcome-sub { font-size:0.93rem; max-width:400px; margin:0 auto 28px; }
.suggestion-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:500px; margin:0 auto; }
.suggestion-btn { padding:12px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:white; font-size:0.85rem; font-weight:600; cursor:pointer; text-align:left; transition:all 0.18s; }
.suggestion-btn:hover { border-color:var(--violet); color:var(--violet); }
.typing-dots { display:flex; gap:5px; align-items:center; padding:12px 16px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--violet); animation:bounce 1.2s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay:0.2s; }
.dot:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
.ai-bubble-content { white-space:pre-wrap; word-break:break-word; }
</style>

</head>
<body>
<div class="ai-page">
  <div class="ai-topbar">
    <div class="ai-topbar-left">
      <button class="btn btn-ghost btn-sm" onclick="history.back()">← Back</button>
      <div class="ai-topbar-icon">🤖</div>
      <div>
        <div class="ai-topbar-title">StudySync AI</div>
        <div class="ai-topbar-sub">Powered by Gemini — Doubts, Topics, Solutions</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="clearChat()">🗑️ Clear</button>
      <select id="langSelect" class="form-input form-select" style="width:auto;padding:6px 28px 6px 12px;font-size:0.82rem">
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
      </select>
    </div>
  </div>

  <div class="ai-chat-area" id="chatArea">
    <div class="welcome-area" id="welcomeArea">
      <span class="welcome-icon">🤖</span>
      <h2 class="welcome-title">Namaste! Main StudySync AI hun 👋</h2>
      <p class="welcome-sub">Koi bhi topic samjho, doubt clear karo, ya quiz solutions samjho — Hindi ya English mein!</p>
      <div class="suggestion-grid">
        <button class="suggestion-btn" onclick="quickAsk('Explain Newton\'s laws of motion with examples')">⚡ Newton's Laws samjhao</button>
        <button class="suggestion-btn" onclick="quickAsk('Photosynthesis kya hai? Step by step batao')">🌿 Photosynthesis explain karo</button>
        <button class="suggestion-btn" onclick="quickAsk('JEE mains mein score kaise badhaye?')">🎯 JEE tips chahiye</button>
        <button class="suggestion-btn" onclick="quickAsk('Chemical bonding ke types kya hain?')">⚗️ Chemical bonding</button>
        <button class="suggestion-btn" onclick="quickAsk('Integration ke formulas batao with examples')">📐 Integration formulas</button>
        <button class="suggestion-btn" onclick="quickAsk('NEET Biology ke important topics kaun se hain?')">🧬 NEET Biology topics</button>
      </div>
    </div>
  </div>

  <div class="ai-input-area">
    <div class="quick-topics">
      <span style="font-size:0.75rem;font-weight:700;color:var(--gray);margin-right:4px">Quick:</span>
      <span class="qt-chip" onclick="quickAsk('Ek concept explain karo')">📖 Explain Topic</span>
      <span class="qt-chip" onclick="quickAsk('Mujhe is topic ka summary do')">📝 Summary</span>
      <span class="qt-chip" onclick="quickAsk('Iska formula kya hai?')">🔢 Formula</span>
      <span class="qt-chip" onclick="quickAsk('Example ke saath samjhao')">💡 Example</span>
    </div>
    <div class="ai-input-row">
      <textarea class="ai-textarea" id="aiInput" rows="1" placeholder="Koi bhi question poochho — doubt, topic, formula..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="ai-send-btn" onclick="sendToAI()" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { askAI, resetChat } from "../js/ai.js";

const chatArea = document.getElementById("chatArea");
let isThinking = false;

window.sendToAI = async function() {
  const input = document.getElementById("aiInput");
  const text  = input.value.trim();
  if (!text || isThinking) return;
  input.value = ""; autoResize(input);
  await processMessage(text);
};

window.quickAsk = async function(text) {
  await processMessage(text);
};

async function processMessage(text) {
  hideWelcome();
  isThinking = true;

  // User bubble
  appendBubble("user", text);

  // Typing indicator
  const typingEl = appendTyping();
  chatArea.scrollTop = chatArea.scrollHeight;

  const lang = document.getElementById("langSelect").value;
  const sysPmt = `You are StudySync AI, a friendly tutor for Indian students studying JEE, NEET, and NCERT. Respond in ${lang==="hindi"?"Hindi (Hinglish is fine)":"English"}. Be clear, step-by-step, encouraging. Use examples. Keep answers educational and precise.`;

  const reply = await askAI(text, sysPmt);
  typingEl.remove();
  appendBubble("ai", reply);
  chatArea.scrollTop = chatArea.scrollHeight;
  isThinking = false;
}

function appendBubble(role, text) {
  const isUser = role === "user";
  const el = document.createElement("div");
  el.className = `ai-msg ${isUser?"user-msg":""}`;
  el.innerHTML = `
    ${!isUser ? `<div class="ai-avatar">🤖</div>` : ""}
    <div class="ai-bubble"><div class="ai-bubble-content">${escHtml(text)}</div></div>
    ${isUser ? `<div class="ai-avatar" style="background:linear-gradient(135deg,var(--violet),var(--sky))">👤</div>` : ""}
  `;
  chatArea.appendChild(el);
  return el;
}

function appendTyping() {
  const el = document.createElement("div");
  el.className = "ai-msg";
  el.innerHTML = `<div class="ai-avatar">🤖</div><div class="ai-bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chatArea.appendChild(el);
  return el;
}

function hideWelcome() {
  const w = document.getElementById("welcomeArea");
  if (w) w.style.display = "none";
}

window.clearChat = function() {
  resetChat();
  chatArea.innerHTML = `<div class="welcome-area" id="welcomeArea"><span class="welcome-icon">🤖</span><h2 class="welcome-title">Chat clear ho gaya! 🗑️</h2><p class="welcome-sub">Naya sawaal poochho!</p></div>`;
};

window.handleKey = function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendToAI(); }
};

window.autoResize = function(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
};

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
</script>
</body>
</html>
