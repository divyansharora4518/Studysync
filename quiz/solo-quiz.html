<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solo Quiz — StudySync</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
body { background:#F7F5FF; }
.quiz-page { min-height:100vh; padding:80px 5vw 40px; }
.quiz-topbar { position:fixed; top:0; left:0; right:0; height:64px; background:white; border-bottom:1.5px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 5vw; z-index:100; }
.quiz-topbar-logo { font-family:'Sora',sans-serif; font-weight:800; font-size:1.2rem; color:var(--violet); display:flex; align-items:center; gap:8px; }
.setup-card { background:white; border-radius:var(--radius-lg); padding:40px; max-width:560px; margin:0 auto; box-shadow:var(--shadow-lg); border:1.5px solid var(--border); }
.setup-title { font-size:1.7rem; margin-bottom:6px; }
.setup-sub { color:var(--gray); margin-bottom:28px; }
.quiz-wrap { max-width:700px; margin:0 auto; }
.q-card { background:white; border-radius:var(--radius-lg); padding:32px; box-shadow:var(--shadow); border:1.5px solid var(--border); margin-bottom:20px; }
.q-num { font-size:0.78rem; font-weight:800; color:var(--violet); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.result-wrap { max-width:700px; margin:0 auto; }
.result-card { background:white; border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-lg); border:1.5px solid var(--border); text-align:center; margin-bottom:20px; }
.score-circle { width:110px; height:110px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:'Sora',sans-serif; background:linear-gradient(135deg,var(--violet),var(--sky)); box-shadow:0 8px 28px rgba(108,78,255,0.35); }
.score-num { font-size:2rem; font-weight:800; color:white; line-height:1; }
.score-tot { font-size:0.8rem; color:rgba(255,255,255,0.8); }
.soln-card { background:white; border-radius:var(--radius-sm); padding:20px; border:1.5px solid var(--border); margin-bottom:12px; }
.soln-q { font-weight:700; margin-bottom:10px; font-size:0.95rem; }
.soln-opts { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.soln-opt { padding:8px 12px; border-radius:8px; font-size:0.88rem; font-weight:600; border:1.5px solid var(--gray-light); }
.soln-opt.correct { border-color:#22C55E; background:rgba(34,197,94,0.08); color:#166534; }
.soln-opt.wrong   { border-color:#EF4444; background:rgba(239,68,68,0.07); color:#991B1B; }
.soln-exp { background:#F0EDFF; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:var(--dark); line-height:1.6; }
.doubt-box { margin-top:10px; }
.doubt-input { width:100%; padding:10px 14px; border:2px solid var(--gray-light); border-radius:8px; font-family:'Nunito',sans-serif; font-size:0.88rem; outline:none; resize:none; }
.doubt-input:focus { border-color:var(--violet); }
.doubt-reply { background:#F0EDFF; border-radius:8px; padding:12px 14px; font-size:0.88rem; margin-top:8px; display:none; }
</style>
</head>
<body>
<div class="quiz-topbar">
  <div class="quiz-topbar-logo">📚 StudySync — Solo Quiz</div>
  <div style="display:flex;gap:8px">
    <a href="../dashboard/dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
    <a href="../ai/ai-chat.html" class="btn btn-ghost btn-sm">🤖 AI Chat</a>
  </div>
</div>

<div class="quiz-page">
  <!-- SETUP SCREEN -->
  <div id="setupScreen">
    <div class="setup-card">
      <h2 class="setup-title">🧠 Solo AI Quiz</h2>
      <p class="setup-sub">Akele practice karo — Gemini AI se personalized questions milenge!</p>
      <div class="form-group"><label class="form-label">Subject</label>
        <select id="sSubject" class="form-input form-select">
          <option value="Mathematics">📐 Mathematics</option>
          <option value="Physics">⚡ Physics</option>
          <option value="Chemistry">⚗️ Chemistry</option>
          <option value="Biology">🧬 Biology</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Category / Exam</label>
        <select id="sCategory" class="form-input form-select">
          <option value="JEE">JEE</option>
          <option value="NEET">NEET</option>
          <option value="NCERT">NCERT</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Language</label>
        <select id="sLang" class="form-input form-select">
          <option value="english">🇬🇧 English</option>
          <option value="hindi">🇮🇳 Hindi</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Questions</label>
        <select id="sCount" class="form-input form-select">
          <option value="5">5 Questions</option>
          <option value="10">10 Questions</option>
          <option value="15">15 Questions</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="startBtn" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" style="display:none">
    <div class="quiz-wrap">
      <div class="quiz-progress"><div class="quiz-progress-fill" id="progressFill" style="width:0%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:18px;font-size:0.85rem;font-weight:700;color:var(--gray)">
        <span id="qNumLabel">Question 1 of 5</span>
        <span id="qTimer" style="color:var(--violet)">⏱ 00:00</span>
      </div>
      <div class="q-card" id="qCard">
        <div class="q-num" id="qNum">QUESTION 1</div>
        <div class="quiz-question" id="qText">Loading...</div>
        <div class="quiz-options" id="qOpts"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()" disabled>← Prev</button>
        <span id="ansCount" style="font-size:0.82rem;color:var(--gray)">0 answered</span>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQ()">Next →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" style="display:none">
    <div class="result-wrap">
      <div class="result-card">
        <div class="score-circle"><div class="score-num" id="scoreNum">0</div><div class="score-tot" id="scoreTot">/ 5</div></div>
        <h2 id="resultMsg">Good job!</h2>
        <p id="resultSub" style="color:var(--gray);margin:8px 0 24px">Neeche solutions aur explanations dekho</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-primary" onclick="location.reload()">Try Again 🔄</button>
          <a href="../ai/ai-chat.html" class="btn btn-outline">🤖 AI se poochho</a>
        </div>
      </div>
      <h3 style="margin-bottom:16px">📖 Solutions & Explanations</h3>
      <div id="solutionsList"></div>
    </div>
  </div>
</div>

<script type="module">
import { generateQuiz, saveSoloResult } from "../js/quiz.js";
import { askAI } from "../js/ai.js";

let questions = [];
let answers   = {};
let curIdx    = 0;
let timerSec  = 0;
let timerInterval;

window.startQuiz = async function() {
  const btn = document.getElementById("startBtn");
  btn.textContent = "⏳ Generating questions..."; btn.disabled = true;
  try {
    questions = await generateQuiz({
      subject:      document.getElementById("sSubject").value,
      category:     document.getElementById("sCategory").value,
      language:     document.getElementById("sLang").value,
      numQuestions: parseInt(document.getElementById("sCount").value)
    });
    document.getElementById("setupScreen").style.display = "none";
    document.getElementById("quizScreen").style.display  = "block";
    curIdx = 0; answers = {};
    renderQ(curIdx);
    startTimer();
  } catch(e) {
    alert("Error: " + e.message);
    btn.textContent = "Start Quiz 🚀"; btn.disabled = false;
  }
};

function startTimer() {
  timerInterval = setInterval(() => {
    timerSec++;
    const m = String(Math.floor(timerSec/60)).padStart(2,"0");
    const s = String(timerSec%60).padStart(2,"0");
    document.getElementById("qTimer").textContent = `⏱ ${m}:${s}`;
  }, 1000);
}

function renderQ(idx) {
  const q   = questions[idx];
  const tot = questions.length;
  document.getElementById("qNum").textContent      = `QUESTION ${idx+1}`;
  document.getElementById("qText").textContent     = q.question;
  document.getElementById("qNumLabel").textContent = `Question ${idx+1} of ${tot}`;
  document.getElementById("progressFill").style.width = `${((idx+1)/tot)*100}%`;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").textContent = idx === tot-1 ? "Submit ✅" : "Next →";

  const opts = document.getElementById("qOpts");
  opts.innerHTML = q.options.map((o, oi) => `
    <button class="quiz-option ${answers[idx]===oi?"selected":""}" onclick="selectOpt(${idx},${oi})">
      <span style="font-weight:800;margin-right:4px">${["A","B","C","D"][oi]})</span> ${o}
    </button>
  `).join("");

  const ans = Object.keys(answers).length;
  document.getElementById("ansCount").textContent = `${ans} answered`;
}

window.selectOpt = function(qi, oi) {
  answers[qi] = oi;
  renderQ(qi);
};

window.nextQ = function() {
  if (curIdx < questions.length - 1) { curIdx++; renderQ(curIdx); }
  else submitQuiz();
};

window.prevQ = function() {
  if (curIdx > 0) { curIdx--; renderQ(curIdx); }
};

async function submitQuiz() {
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, qi) => { if (answers[qi] === q.correct) score++; });

  const msg  = score === questions.length ? "Perfect Score! 🎉" : score >= questions.length*0.7 ? "Great Job! 💪" : score >= questions.length*0.4 ? "Keep Practicing! 📚" : "Don't Give Up! 🔥";
  const msgs = ["Review the solutions below!", "Solutions neeche dekho", "Explanations padho aur dubara try karo", "AI se doubts clear karo!"];

  document.getElementById("setupScreen").style.display  = "none";
  document.getElementById("quizScreen").style.display   = "none";
  document.getElementById("resultScreen").style.display = "block";
  document.getElementById("scoreNum").textContent = score;
  document.getElementById("scoreTot").textContent = `/ ${questions.length}`;
  document.getElementById("resultMsg").textContent = msg;
  document.getElementById("resultSub").textContent = msgs[Math.floor(Math.random()*msgs.length)];

  // Render solutions
  document.getElementById("solutionsList").innerHTML = questions.map((q, qi) => {
    const userAns = answers[qi];
    return `<div class="soln-card">
      <div class="soln-q">Q${qi+1}: ${q.question}</div>
      <div class="soln-opts">${q.options.map((o,oi) => `<div class="soln-opt ${oi===q.correct?"correct":oi===userAns&&userAns!==q.correct?"wrong":""}">${o}${oi===q.correct?" ✓":""}</div>`).join("")}</div>
      <div class="soln-exp">💡 ${q.explanation}</div>
      <div class="doubt-box">
        <textarea class="doubt-input" rows="2" placeholder="Koi aur doubt? AI se poochho..." id="doubt_${qi}"></textarea>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="askDoubt(${qi})">🤖 Ask AI</button>
        <div class="doubt-reply" id="dreply_${qi}"></div>
      </div>
    </div>`;
  }).join("");

  await saveSoloResult(
    document.getElementById("sSubject")?.value || "Unknown",
    document.getElementById("sCategory")?.value || "Unknown",
    score, questions.length, questions
  );
}

window.askDoubt = async function(qi) {
  const inp  = document.getElementById(`doubt_${qi}`);
  const rep  = document.getElementById(`dreply_${qi}`);
  const text = inp.value.trim();
  if (!text) { inp.placeholder = "Kuch likho toh sahi!"; return; }
  rep.style.display = "block";
  rep.textContent   = "⏳ AI soch raha hai...";
  const q = questions[qi];
  const context = `Q: ${q.question}\nCorrect: ${q.options[q.correct]}\nExplanation: ${q.explanation}\nStudent doubt: ${text}`;
  const reply   = await askAI(context, "You are a helpful study tutor. Explain clearly in the student's language.");
  rep.textContent = `🤖 ${reply}`;
  inp.value = "";
};
</script>
</body>
</html>
